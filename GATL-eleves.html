<body><main id="app"></main>
<footer id="status" role="status" aria-live="polite"></footer><script>const lessons = {"S01":{"title":"Les acteurs d’un service de livraison","objective":"Identifier les agents économiques, leur fonction principale et leurs échanges.","documents":"<p class=\"meta\">S01 · Module 1</p><h2>Les acteurs d’un service de livraison</h2><p><strong>Objectif :</strong> Identifier les agents économiques, leur fonction principale et leurs échanges.</p><p class=\"contexte\">Vous effectuez votre PFMP chez VéloQuartier, une entreprise de livraison urbaine. La responsable prépare une présentation de son activité à la mairie et vous demande d’expliquer les relations entre les acteurs du quartier.</p><h3>Repères</h3><div class=\"repere\">Un agent économique est un centre de décision. Les ménages consomment et offrent leur travail ; les entreprises produisent ; les administrations publiques assurent notamment des services collectifs et redistribuent ; les institutions financières financent l’activité. Les associations peuvent produire des services marchands ou non marchands. Le reste du monde rassemble les agents non résidents en relation avec l’économie nationale. Une même organisation peut acheter, vendre, employer et investir : son classement ne dépend pas d’une opération isolée.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Les partenaires de VéloQuartier</h3><table><thead><tr><th>Acteur</th><th>Opération observée</th></tr></thead><tbody><tr><td>Nora, habitante du quartier</td><td>Achète une livraison pour 6 € et travaille dans un restaurant.</td></tr><tr><td>VéloQuartier</td><td>Livre les commandes, emploie six salariés et achète des vélos.</td></tr><tr><td>Banque Horizon</td><td>Accorde un prêt de 12 000 € à VéloQuartier.</td></tr><tr><td>Commune</td><td>Aménage une piste cyclable accessible au public.</td></tr><tr><td>Association Coup de main</td><td>Distribue gratuitement des colis alimentaires grâce à des dons.</td></tr><tr><td>Fabricant installé en Belgique</td><td>Vend trois vélos à VéloQuartier pour 6 000 €.</td></tr></tbody></table><h3>Document 2 — Les décisions du mois</h3><p>La banque ne décide pas à la place du dirigeant : elle examine la capacité de remboursement. La commune finance une piste cyclable par son budget. L’association organise une activité de distribution sans vendre les colis aux bénéficiaires. Le fabricant belge se situe hors du territoire économique français.</p>","questions":["1. Classez les six acteurs par catégorie d’agents. Justifiez chaque classement par une fonction principale.","2. Relevez deux besoins satisfaits par des biens et deux besoins satisfaits par des services. Distinguez besoin et moyen de le satisfaire.","3. Expliquez pourquoi le salarié de VéloQuartier appartient aux ménages alors que son employeur appartient aux entreprises.","4. Identifiez deux interdépendances : que se passerait-il pour l’activité si le financement ou la piste cyclable disparaissait ?","Production professionnelle — Rédigez une note de huit à dix lignes présentant trois partenaires indispensables à VéloQuartier et les conséquences d’une difficulté chez l’un d’eux. Utilisez les termes production, consommation et financement.","Pour approfondir — Une association vend désormais des repas pour financer ses distributions. Cette vente suffit-elle à la classer automatiquement parmi les entreprises ? Argumentez sans vous limiter au mot « vente »."]},"S02":{"title":"Les flux et les marchés","objective":"Distinguer les flux réels et monétaires et représenter les échanges.","documents":"<p class=\"meta\">S02 · Module 1</p><h2>Les flux et les marchés</h2><p><strong>Objectif :</strong> Distinguer les flux réels et monétaires et représenter les échanges.</p><p class=\"contexte\">VéloQuartier prépare son budget mensuel. Les opérations ci-dessous concernent des prestations déjà réalisées et payées, sauf mention contraire. Il faut présenter les échanges sans confondre ventes, financement et bénéfice.</p><h3>Repères</h3><div class=\"repere\">Un flux réel porte sur un bien, un service ou un travail. Un flux monétaire correspond à un paiement. Le marché met en relation une offre et une demande : biens et services, travail ou financement. Le chiffre d’affaires mesure les ventes ; un emprunt n’est pas une vente. Le remboursement du capital d’un emprunt n’est pas, à lui seul, une charge de production. Un solde d’encaissements et de décaissements ne permet donc pas de calculer directement un bénéfice.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Échanges observés</h3><table><thead><tr><th>Opération</th><th>Montant</th></tr></thead><tbody><tr><td>Livraisons achetées par les ménages</td><td>4 800 €</td></tr><tr><td>Livraisons achetées par les commerces</td><td>3 200 €</td></tr><tr><td>Rémunérations versées aux salariés</td><td>3 000 €</td></tr><tr><td>Achat de trois vélos au fabricant belge</td><td>6 000 €</td></tr><tr><td>Prêt versé par la banque</td><td>12 000 €</td></tr><tr><td>Remboursement du capital d’un prêt antérieur</td><td>400 €</td></tr></tbody></table><h3>Document 2 — Une demande supplémentaire</h3><p>Un commerce propose 150 livraisons de plus dans le mois, à 5 € la livraison. L’entreprise estime qu’elle devra engager 520 € de dépenses supplémentaires pour cette activité. Les horaires des salariés et la capacité des vélos doivent être vérifiés avant l’acceptation.</p>","questions":["1. Pour les quatre premières opérations, nommez le flux réel, son sens et le flux monétaire associé.","2. Représentez un circuit entre ménages, entreprise, banque, commune et fabricant étranger. Donnez un intitulé à chaque flèche.","3. Calculez le chiffre d’affaires mensuel. Expliquez pourquoi les 12 000 € du prêt n’y figurent pas.","4. Calculez les recettes et dépenses supplémentaires de l’offre du commerce, puis l’écart. Cet écart suffit-il à accepter la proposition ?","Production professionnelle — Présentez une recommandation au responsable : accepter, refuser ou accepter sous conditions les 150 livraisons. Appuyez-vous sur les montants et sur au moins deux contraintes opérationnelles.","Pour approfondir — Une livraison est facturée ce mois-ci mais sera payée le mois prochain. Expliquez pourquoi vente et encaissement peuvent être décalés."]},"S03":{"title":"Le cadre juridique et les contrats","objective":"Identifier une règle applicable, une juridiction et les obligations issues d’un contrat.","documents":"<p class=\"meta\">S03 · Module 1</p><h2>Le cadre juridique et les contrats</h2><p><strong>Objectif :</strong> Identifier une règle applicable, une juridiction et les obligations issues d’un contrat.</p><p class=\"contexte\">L’entreprise ColisAzur confie un transport à RouteExpress. Vous devez analyser le dossier avant la rédaction d’une réclamation. Vous étudierez séparément la nature des règles, les engagements du contrat et les conséquences du retard.</p><h3>Repères</h3><div class=\"repere\">Le droit organise les relations et permet de régler les litiges. Une règle interne et un contrat doivent respecter les règles impératives applicables. Pour le droit interne, la Constitution, la loi et les règlements n’occupent pas le même rang ; le droit de l’Union et les engagements internationaux doivent aussi être pris en compte selon leurs conditions d’application. Un contrat crée des obligations entre ses parties. Pour rechercher une responsabilité contractuelle, il faut analyser l’inexécution, le dommage et leur lien, puis les éventuelles causes d’exonération.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Bon de commande accepté</h3><p>ColisAzur commande à RouteExpress le transport de 40 cartons pour 640 € HT. Livraison prévue le mardi avant 10 h. RouteExpress confirme la commande par courriel. ColisAzur transmet l’adresse et les horaires d’accès exacts. Le client doit payer sous trente jours après la facture. La livraison a lieu le mercredi à 11 h. Aucun incident exceptionnel ni obstacle imputable au client n’est signalé.</p><h3>Document 2 — Pièces du dossier et litiges distincts</h3><table><thead><tr><th>Pièce ou situation</th><th>Fait</th></tr></thead><tbody><tr><td>Justificatif de personnel mobilisé inutilement</td><td>120 €</td></tr><tr><td>Deuxième intervention d’un technicien</td><td>80 €</td></tr><tr><td>Courriel commercial</td><td>Le retard aurait abîmé notre réputation, sans autre justificatif.</td></tr><tr><td>Autre dossier A</td><td>Une salariée conteste un salaire non payé par son employeur privé.</td></tr><tr><td>Autre dossier B</td><td>Un habitant conteste un refus de permis de construire de la commune.</td></tr></tbody></table>","questions":["1. Nommez les parties, l’objet, le prix et deux obligations réciproques du contrat. La confirmation par courriel est-elle un indice de l’accord ?","2. Identifiez l’engagement inexécuté et les pièces à réunir pour prouver le retard.","3. Calculez le préjudice chiffré documenté. Pourquoi l’affirmation sur la réputation ne suffit-elle pas à ajouter arbitrairement un montant ?","4. Pour les seuls dossiers A et B, choisissez entre conseil de prud’hommes et tribunal administratif. Justifiez. Classez aussi Constitution, loi, décret et contrat dans un ordre cohérent pour le droit interne, en signalant la place particulière du contrat.","Production professionnelle — Rédigez une réclamation professionnelle : faits datés, engagement, dommage documenté, demande motivée et pièces jointes. N’inventez ni pénalité automatique ni règle de transport absente du dossier.","Pour approfondir — Le client avait transmis une adresse erronée. Quelle vérification supplémentaire faudrait-il faire avant de conclure à la responsabilité exclusive du transporteur ?"]},"S04":{"title":"Revenus, budget et consommation","objective":"Identifier les revenus, calculer un budget et interpréter une évolution.","documents":"<p class=\"meta\">S04 · Module 2</p><h2>Revenus, budget et consommation</h2><p><strong>Objectif :</strong> Identifier les revenus, calculer un budget et interpréter une évolution.</p><p class=\"contexte\">Le foyer Martin souhaite remplacer un ordinateur tout en conservant une épargne de précaution. Il vous demande une comparaison de deux budgets mensuels. Les montants sont des données d’exercice ; les remboursements de prêts sont présentés comme dépenses du budget.</p><h3>Repères</h3><div class=\"repere\">Le revenu disponible sert à consommer et à épargner. Le crédit n’est pas un revenu : il finance une dépense contre un remboursement futur. Le budget décrit des encaissements et décaissements. Un taux d’évolution se calcule par (valeur finale − valeur initiale) / valeur initiale × 100. Une part de budget se calcule par montant du poste / total retenu × 100 : il faut toujours nommer le dénominateur.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Ressources et dépenses du mois</h3><table><thead><tr><th>Poste</th><th>Montant</th></tr></thead><tbody><tr><td>Salaires nets perçus</td><td>2 100 €</td></tr><tr><td>Prestations sociales</td><td>240 €</td></tr><tr><td>Revenus du patrimoine</td><td>60 €</td></tr><tr><td>Logement et charges</td><td>850 €</td></tr><tr><td>Alimentation</td><td>420 €</td></tr><tr><td>Transport</td><td>240 €</td></tr><tr><td>Télécommunications</td><td>90 €</td></tr><tr><td>Santé, loisirs et autres dépenses</td><td>300 €</td></tr><tr><td>Remboursement d’un prêt</td><td>150 €</td></tr></tbody></table><h3>Document 2 — Arbitrage du mois suivant</h3><p>Le foyer prévoit 2 400 € de ressources. Le transport passe de 240 € à 300 € et l’alimentation de 420 € à 462 €. Les autres dépenses restent identiques. L’ordinateur coûte 600 €. Le foyer dispose déjà de 700 € sur un livret et souhaite préserver au moins 500 € de réserve.</p>","questions":["1. Classez les ressources entre travail, transfert et patrimoine. Calculez leur total.","2. Calculez les dépenses totales et le solde mensuel. Quelle somme peut alimenter l’épargne si les prévisions se réalisent ?","3. Calculez les taux d’évolution du transport et de l’alimentation. Comparez les variations en euros et en pourcentage.","4. Calculez le nouveau solde. Le foyer peut-il payer immédiatement l’ordinateur en utilisant seulement la part du livret au-dessus de 500 € et le solde du mois suivant ?","Production professionnelle — Proposez un calendrier d’achat sans crédit. Précisez les hypothèses et expliquez pourquoi préserver une réserve peut être utile. Comparez ce choix avec une offre de crédit dont les échéances réduiraient les prochains soldes.","Pour approfondir — Calculez la part du logement dans les ressources, puis dans les dépenses du premier mois. Pourquoi les pourcentages diffèrent-ils ?"]},"S05":{"title":"Consommer autrement et protéger ses données","objective":"Comparer des modes de consommation et apprécier les données nécessaires à un service.","documents":"<p class=\"meta\">S05 · Module 2</p><h2>Consommer autrement et protéger ses données</h2><p><strong>Objectif :</strong> Comparer des modes de consommation et apprécier les données nécessaires à un service.</p><p class=\"contexte\">Le lycée envisage un service de prêt de vélos pour les déplacements entre deux sites. Le conseil de vie lycéenne compare l’achat, la location et le reconditionné. Une application de réservation est aussi proposée.</p><h3>Repères</h3><div class=\"repere\">Le coût d’usage dépasse le prix d’achat : entretien, réparation, assurance éventuelle, énergie et durée de vie comptent. Le réemploi prolonge l’utilisation d’un bien. Une décision durable s’appuie sur plusieurs critères et sur des preuves, pas seulement sur un slogan. Les données personnelles demandées doivent correspondre à l’objectif du service. Un renseignement utile pour réserver n’est pas forcément nécessaire pour recevoir de la publicité.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Comparaison sur trois ans</h3><table><thead><tr><th>Option pour un vélo</th><th>Prix et entretien</th><th>Autres éléments</th></tr></thead><tbody><tr><td>A — Vélo neuf</td><td>540 € + 60 € d’entretien par an</td><td>Garantie, disponibilité immédiate.</td></tr><tr><td>B — Vélo reconditionné</td><td>300 € + 90 € d’entretien par an</td><td>État contrôlé, stock limité.</td></tr><tr><td>C — Location</td><td>22 € par mois pendant 36 mois</td><td>Entretien inclus ; le vélo doit être rendu.</td></tr></tbody></table><p>Les coûts indiqués sont les seuls coûts chiffrés à comparer. La valeur de revente n’est pas connue. Aucun bilan carbone chiffré n’est fourni.</p><h3>Document 2 — Formulaire proposé par l’application</h3><p>Champs obligatoires proposés : nom, classe, adresse électronique scolaire, créneau souhaité, numéro de sécurité sociale, liste des contacts du téléphone. Une case « J’accepte les offres commerciales de nos partenaires » est précochée. Le règlement précise que l’identité scolaire sert à attribuer et restituer le vélo.</p>","questions":["1. Calculez le coût de chaque option pour un vélo sur trois ans. Classez les solutions par coût.","2. Pour une flotte de dix vélos, calculez l’écart entre les deux options les moins coûteuses. Proposez deux critères qui peuvent modifier le classement final.","3. Expliquez pourquoi l’affirmation « le reconditionné émet exactement 50 % de moins » ne peut pas être démontrée avec ces seuls documents.","4. Classez les champs du formulaire entre nécessaires au prêt et manifestement excessifs. Distinguez le fonctionnement du prêt et la prospection commerciale.","Production professionnelle — Rédigez une recommandation d’achat ou de location et proposez un formulaire corrigé. Argumentez sur le coût, la disponibilité, la maintenance et les données collectées.","Pour approfondir — Ajoutez une estimation de revente de 180 € pour A et de 80 € pour B. Recalculez leur coût net et discutez la fiabilité de ces estimations."]},"S06":{"title":"Acheter en ligne et traiter une réclamation","objective":"Distinguer rétractation et garantie de conformité et rédiger une demande argumentée.","documents":"<p class=\"meta\">S06 · Module 2</p><h2>Acheter en ligne et traiter une réclamation</h2><p><strong>Objectif :</strong> Distinguer rétractation et garantie de conformité et rédiger une demande argumentée.</p><p class=\"contexte\">Vous aidez le service client du site AtelierConnect. Deux consommateurs particuliers ont acheté des produits ordinaires non personnalisés auprès de ce vendeur professionnel. Vous devez choisir la procédure adaptée à chaque cas.</p><h3>Repères</h3><div class=\"repere\">Pour un achat à distance, le consommateur dispose en principe de quatorze jours pour notifier sa rétractation après réception du bien ; des exceptions existent, notamment pour certains biens personnalisés. Cette procédure concerne le changement d’avis. La garantie légale de conformité traite un bien non conforme ; elle s’exerce auprès du vendeur professionnel. Pour un bien neuf, les défauts apparaissant dans les deux ans de la délivrance sont présumés antérieurs à celle-ci. Les conditions et solutions doivent être distinguées d’une simple garantie commerciale.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Deux demandes au service client</h3><table><thead><tr><th>Dossier</th><th>Éléments disponibles</th></tr></thead><tbody><tr><td>A — Changement d’avis</td><td>Casque neuf reçu le 5 octobre. Le 10 octobre, le client écrit qu’il ne le souhaite plus. Produit standard, non personnalisé. Le casque fonctionne.</td></tr><tr><td>B — Produit défectueux</td><td>Ordinateur neuf reçu le 5 janvier de la même année. En juin, il ne démarre plus dans des conditions normales d’usage. Facture disponible. Le client demande une réparation.</td></tr></tbody></table><h3>Document 2 — Propositions de réponse du vendeur</h3><p>Réponse envisagée à A : « Tout achat est définitif, nous refusons les retours. » Réponse envisagée à B : « Vous n’avez pas payé la garantie commerciale, nous ne pouvons rien faire ; adressez-vous uniquement au fabricant. » Les deux achats ont été effectués et payés par des particuliers.</p>","questions":["1. Identifiez pour chaque dossier le problème juridique et la procédure pertinente. Justifiez à partir des faits.","2. Expliquez pourquoi les deux réponses proposées sont contestables dans les situations décrites.","3. Établissez une liste des pièces utiles pour A puis pour B. Quelle information précise manque encore pour organiser le retour de A ?","4. Proposez une réponse professionnelle au dossier B sans promettre un remboursement automatique et immédiat.","Production professionnelle — Rédigez deux courriels courts : pour A, une notification claire de rétractation ; pour B, une demande de mise en conformité adressée au vendeur, accompagnée des éléments nécessaires.","Pour approfondir — Le casque porte un prénom gravé à la demande du client. Pourquoi faut-il revoir l’analyse du dossier A ? Distinguez aussi un achat en magasin d’un achat à distance."]},"P01":{"title":"Choisir une combinaison productive","objective":"Identifier les facteurs de production et comparer des combinaisons sous contrainte.","documents":"<p class=\"meta\">P01 · Module 3</p><h2>Choisir une combinaison productive</h2><p><strong>Objectif :</strong> Identifier les facteurs de production et comparer des combinaisons sous contrainte.</p><p class=\"contexte\">L’atelier Équip’Colis prépare des kits d’emballage pour des commerces. La direction hésite entre deux organisations pour produire 1 000 kits conformes par jour. Vous devez chiffrer la décision et examiner ses limites.</p><h3>Repères</h3><div class=\"repere\">Le travail et le capital technique participent à la production. Les consommations intermédiaires sont transformées ou consommées au cours du processus. Une combinaison productive associe ces facteurs. Ils peuvent être complémentaires ou partiellement substituables. La productivité rapporte une production à une quantité de facteur ; elle ne mesure pas directement la qualité ni la rentabilité. Le coût le plus faible ne suffit pas à prouver qu’une organisation est la meilleure.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Deux organisations pour 1 000 kits</h3><table><thead><tr><th>Élément journalier</th><th>Organisation A</th><th>Organisation B</th></tr></thead><tbody><tr><td>Heures de travail</td><td>64 h</td><td>40 h</td></tr><tr><td>Coût d’une heure de travail</td><td>20 €</td><td>20 €</td></tr><tr><td>Coût journalier des équipements</td><td>180 €</td><td>600 €</td></tr><tr><td>Consommations intermédiaires</td><td>300 €</td><td>300 €</td></tr><tr><td>Capacité maximale annoncée</td><td>1 100 kits</td><td>1 500 kits</td></tr></tbody></table><p>Les coûts des équipements incluent ici leur utilisation journalière. On compare le même volume de 1 000 kits conformes. Les temps de maintenance ne sont pas connus.</p><h3>Document 2 — Une contrainte nouvelle</h3><p>Un client envisage 1 300 kits par jour pendant trois mois. L’organisation B nécessite une formation initiale et dépend d’un fournisseur de pièces de maintenance. L’organisation A peut ajuster plus facilement certaines tâches manuelles, mais sa capacité maximale annoncée est insuffisante pour la nouvelle commande.</p>","questions":["1. Classez les ressources du document 1 en travail, capital technique et consommations intermédiaires.","2. Calculez le coût journalier total et le coût par kit de chaque organisation à 1 000 kits.","3. Calculez les productivités horaires en kits par heure. Pourquoi une productivité plus élevée ne garantit-elle pas automatiquement une meilleure rentabilité ?","4. Identifiez l’organisation compatible avec 1 300 kits sans investissement supplémentaire selon les capacités annoncées. Quelles informations faut-il obtenir avant de décider ?","Production professionnelle — Rédigez une recommandation en deux scénarios : 1 000 kits puis 1 300 kits. Présentez les calculs, les contraintes de qualité et de maintenance, ainsi que les conséquences pour les salariés.","Pour approfondir — À 1 000 kits, le coût horaire du travail passe à 23 €. Recalculez les deux coûts et recherchez si le classement change."]},"P02":{"title":"Produire en interne ou externaliser","objective":"Comparer les coûts pertinents et analyser les risques d’une externalisation.","documents":"<p class=\"meta\">P02 · Module 3</p><h2>Produire en interne ou externaliser</h2><p><strong>Objectif :</strong> Comparer les coûts pertinents et analyser les risques d’une externalisation.</p><p class=\"contexte\">NovaLog prépare 2 000 colis par mois. Un prestataire propose de prendre en charge l’emballage. La direction veut connaître le volume à partir duquel l’organisation interne devient plus avantageuse.</p><h3>Repères</h3><div class=\"repere\">Externaliser consiste à confier une activité à une organisation extérieure. La sous-traitance est une forme de relation dans laquelle un prestataire réalise une tâche selon une demande définie. Externaliser ne signifie pas nécessairement délocaliser à l’étranger. Le choix compare des coûts de même périmètre et tient compte du contrôle, des compétences, de la dépendance et de la qualité. Un coût fixe n’évolue pas avec le volume dans la plage étudiée ; un coût variable dépend de l’activité.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Modèles de coûts mensuels</h3><table><thead><tr><th>Option</th><th>Coûts dans la plage de 1 000 à 3 000 colis</th></tr></thead><tbody><tr><td>Interne</td><td>2 400 € de coûts fixes + 1,10 € par colis.</td></tr><tr><td>Prestataire</td><td>2,30 € par colis + 300 € de coordination mensuelle.</td></tr></tbody></table><p>Les coûts internes présentés sont évitables si l’activité est confiée au prestataire ; les éventuels coûts de transition ne sont pas inclus. Les deux options incluent les mêmes opérations d’emballage.</p><h3>Document 2 — Engagements proposés</h3><p>Le prestataire garantit un traitement sous 24 h pour 95 % des colis, mais ne détaille pas encore la mesure de cet engagement. L’entreprise souhaite conserver le suivi des réclamations et la relation client. Le service interne possède une expérience des produits fragiles. Le contrat externe doit encore préciser les règles de confidentialité et les conséquences d’une non-conformité.</p>","questions":["1. Calculez les deux coûts pour 1 000, 2 000 et 3 000 colis. Présentez-les dans un tableau.","2. Déterminez le volume d’égalité à partir de 2 400 + 1,10 × Q = 300 + 2,30 × Q. Interprétez le résultat.","3. Pour 2 000 colis, chiffrez l’écart. Identifiez deux facteurs non chiffrés qui peuvent remettre en cause le choix le moins cher.","4. Proposez trois clauses ou indicateurs à préciser dans le contrat du prestataire. Expliquez pourquoi une externalisation n’efface pas la responsabilité de l’entreprise envers son client.","Production professionnelle — Préparez une note de décision à 2 000 colis, comprenant le coût, les risques, un indicateur de qualité et une condition de réversibilité.","Pour approfondir — Les coûts internes ne seraient en réalité évitables qu’à hauteur de 1 000 € sur les 2 400 € fixes. Refaites la comparaison des décaissements pertinents à 2 000 colis."]},"P03":{"title":"Le numérique et la création de valeur","objective":"Mesurer les effets d’un investissement numérique et proposer des conditions de déploiement.","documents":"<p class=\"meta\">P03 · Module 3</p><h2>Le numérique et la création de valeur</h2><p><strong>Objectif :</strong> Mesurer les effets d’un investissement numérique et proposer des conditions de déploiement.</p><p class=\"contexte\">L’entrepôt ClipStock envisage un système de guidage de préparation relié au logiciel de gestion. Vous étudiez un essai mensuel et devez distinguer gains possibles, coûts et effets sur le travail.</p><h3>Repères</h3><div class=\"repere\">Un outil numérique peut améliorer la circulation de l’information, la traçabilité et l’organisation. Il crée de la valeur s’il améliore réellement le service ou l’usage des ressources. Les gains annoncés doivent être comparés sur un même périmètre et une durée cohérente. Une réduction du temps par commande ne conduit pas automatiquement à une suppression d’emploi : elle peut permettre une meilleure qualité, plus d’activité ou une redistribution des tâches.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Essai sur 8 000 commandes par mois</h3><table><thead><tr><th>Indicateur</th><th>Avant</th><th>Après essai</th></tr></thead><tbody><tr><td>Temps moyen par commande</td><td>6 min</td><td>5 min</td></tr><tr><td>Commandes comportant une erreur</td><td>2 %</td><td>1 %</td></tr><tr><td>Coût moyen de traitement d’une erreur</td><td>15 €</td><td>15 €</td></tr></tbody></table><p>Installation : 12 000 €. Abonnement : 500 € par mois. Formation : 40 heures au total, valorisées 20 €/h. Valorisation de l’heure de travail : 20 €. La cadence et la fiabilité observées pendant l’essai doivent être confirmées.</p><h3>Document 2 — Retour des salariés</h3><p>Les opérateurs apprécient la localisation des articles, mais signalent des alertes trop fréquentes et un besoin de formation en cas de panne. Le système conserve des horodatages individuels. La direction prévoit une phase pilote et doit préciser la finalité, l’accès et la durée de conservation des données.</p>","questions":["1. Calculez les heures théoriquement économisées par mois. Valorisez-les en euros en précisant qu’il ne s’agit pas nécessairement d’une économie de trésorerie.","2. Calculez le nombre d’erreurs avant et après, puis le coût théorique évité.","3. Calculez le gain mensuel théorique net de l’abonnement et le coût initial, formation comprise. Donnez un délai de récupération théorique simple, arrondi au mois supérieur.","4. Proposez trois conditions de déploiement : continuité en cas de panne, formation et traitement des données individuelles.","Production professionnelle — Rédigez un avis au comité de pilotage. Séparez les résultats calculés, les hypothèses à confirmer et les effets sur les salariés. Prévoyez une solution de travail sans guidage numérique.","Pour approfondir — Si seules 50 % des heures théoriquement gagnées sont valorisables, recalculez le gain mensuel et le délai de récupération."]},"P04":{"title":"Évaluer une performance globale","objective":"Mettre en relation les dimensions économique, sociale et environnementale de la performance.","documents":"<p class=\"meta\">P04 · Module 3</p><h2>Évaluer une performance globale</h2><p><strong>Objectif :</strong> Mettre en relation les dimensions économique, sociale et environnementale de la performance.</p><p class=\"contexte\">Le responsable du site industriel ÉcoÉquip présente un projet de nouvelle installation énergétique. Vous devez examiner son tableau de bord et proposer un avis qui tienne compte de plusieurs parties prenantes.</p><h3>Repères</h3><div class=\"repere\">La performance économique concerne notamment les coûts, l’activité et les résultats ; les dimensions sociale et environnementale examinent les effets sur les personnes et les ressources. La RSE conduit à prendre en compte les effets de l’activité sur la société et l’environnement. Un indicateur doit préciser son unité, son périmètre et sa période. La baisse d’une intensité par produit ne garantit pas une baisse du total si la production augmente fortement.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Tableau de bord d’ÉcoÉquip</h3><table><thead><tr><th>Indicateur annuel</th><th>Avant projet</th><th>Prévision après projet</th></tr></thead><tbody><tr><td>Production</td><td>100 000 unités</td><td>120 000 unités</td></tr><tr><td>Énergie consommée</td><td>500 MWh</td><td>480 MWh</td></tr><tr><td>Coût énergétique</td><td>80 000 €</td><td>72 000 €</td></tr><tr><td>Accidents avec arrêt</td><td>4</td><td>2</td></tr><tr><td>Heures de formation</td><td>200 h</td><td>600 h</td></tr></tbody></table><p>Investissement : 160 000 €. Les valeurs après projet sont des prévisions. Le nombre d’accidents n’est pas rapporté au nombre d’heures travaillées, qui n’est pas communiqué.</p><h3>Document 2 — Un investissement industriel réel repéré sur Pearltrees</h3><p>Le Groupe SEB présente sur son site une nouvelle chaufferie biomasse à Pont-Évêque comme un moyen de décarboner son outil industriel. Cette communication d’entreprise constitue un point de départ pour interroger l’énergie, les investissements et les effets environnementaux. Elle ne prouve pas à elle seule la performance globale du site fictif ÉcoÉquip.</p>","questions":["1. Classez les indicateurs du document 1 par dimension, en expliquant les éventuels liens entre dimensions.","2. Calculez l’évolution de la production, de l’énergie totale et du coût énergétique.","3. Calculez la consommation d’énergie par unité avant et après, puis le taux de diminution de cette intensité.","4. Pourquoi ne peut-on pas affirmer que le risque d’accident est divisé par deux ? Quelles données et quelle période de suivi faut-il obtenir ?","Production professionnelle — Proposez un tableau de bord de six indicateurs, avec une cible et une preuve pour chacun. Concluez par un avis nuancé sur le projet, sans confondre prévision et résultat réalisé.","Pour approfondir — Si la production atteignait 150 000 unités avec 4 kWh par unité, quelle serait la consommation totale ? Comparez à la situation initiale."]},"P05":{"title":"Mesurer l’activité économique","objective":"Calculer une valeur ajoutée et interpréter des indicateurs de croissance et de niveau de vie.","documents":"<p class=\"meta\">P05 · Module 4</p><h2>Mesurer l’activité économique</h2><p><strong>Objectif :</strong> Calculer une valeur ajoutée et interpréter des indicateurs de croissance et de niveau de vie.</p><p class=\"contexte\">Vous préparez une note de conjoncture pour un fournisseur d’emballages. Il faut distinguer l’activité d’une entreprise, la production d’un territoire et le niveau de vie moyen. Tous les pays et montants du dossier sont fictifs.</p><h3>Repères</h3><div class=\"repere\">La valeur ajoutée se calcule ici par production moins consommations intermédiaires. Les salaires ne sont pas des consommations intermédiaires : ils sont financés notamment par la valeur ajoutée. Le PIB mesure une production sur un territoire ; sa croissance en volume neutralise l’effet des prix. Le PIB par habitant est une moyenne et ne décrit ni la répartition des revenus ni toutes les dimensions du bien-être.</div><p class=\"meta\">Situations et montants d’exercice, sauf le document industriel explicitement identifié.</p><h3>Document 1 — Compte simplifié de CartonPlus</h3><table><thead><tr><th>Indicateur annuel</th><th>Montant</th></tr></thead><tbody><tr><td>Production vendue ; pas de variation de stocks dans le cas</td><td>500 000 €</td></tr><tr><td>Matières et emballages achetés puis consommés</td><td>150 000 €</td></tr><tr><td>Énergie et services extérieurs consommés</td><td>60 000 €</td></tr><tr><td>Salaires et cotisations</td><td>180 000 €</td></tr></tbody></table><h3>Document 2 — Deux territoires fictifs</h3><table><thead><tr><th>Indicateur</th><th>Territoire A</th><th>Territoire B</th></tr></thead><tbody><tr><td>PIB année 1, en volume, milliards d’unités monétaires comparables</td><td>800</td><td>600</td></tr><tr><td>PIB année 2, en volume, mêmes unités</td><td>824</td><td>624</td></tr><tr><td>Population année 2</td><td>20 millions</td><td>24 millions</td></tr><tr><td>Taux de chômage année 2</td><td>7 %</td><td>5 %</td></tr></tbody></table><p>Pour A, un indice de PIB en valeur passe de 100 à 106 tandis que l’indice de prix associé passe de 100 à environ 102,91. Les conditions de comparaison des populations et des unités sont supposées cohérentes dans l’exercice.</p>","questions":["1. Calculez les consommations intermédiaires puis la valeur ajoutée de CartonPlus. Expliquez pourquoi il ne faut pas déduire les salaires pour obtenir la valeur ajoutée.","2. Calculez la croissance en volume des territoires A et B. Identifiez celui qui croît le plus vite et celui dont le PIB reste le plus élevé.","3. Calculez le PIB par habitant en année 2 pour chaque territoire, en explicitant la conversion milliards/millions.","4. Expliquez pourquoi une hausse de 6 % du PIB en valeur de A ne signifie pas une croissance réelle de 6 %. Donnez deux limites à un classement de la qualité de vie fondé uniquement sur le PIB.","Production professionnelle — Rédigez une note comparative de dix à douze lignes. Utilisez trois indicateurs, distinguez niveau et évolution, et indiquez deux informations supplémentaires nécessaires pour éclairer une décision d’implantation.","Pour approfondir — Pour A, vérifiez l’ordre de grandeur de la croissance réelle par 106 / 102,91 − 1. Pourquoi la simple soustraction 6 % − 2,91 % n’est-elle qu’une approximation ?"]},"R01":{"title":"Accueillir et comprendre la demande","objective":"Poser une question utile et reformuler le besoin du client.","documents":"<div></div><h3>Situation · Au comptoir</h3><p>Une cliente dit : « Bonjour, j’ai commandé un article hier. J’en ai besoin avant vendredi et je ne sais pas quand il sera prêt. » Le retrait est annoncé sous deux jours ouvrés après confirmation. Le numéro de commande figure sur son reçu.</p><h3>Repère</h3><p>Reformuler, c’est redire avec tes mots ce que le client attend, puis vérifier que tu as bien compris.</p>","questions":["Écris une phrase pour accueillir et rassurer la cliente, sans lui promettre une date.","Quelle information demandes-tu pour consulter la commande ?","Reformule le besoin de la cliente en une phrase.","Propose une suite concrète à donner après la vérification."]},"R02":{"title":"Traiter une réclamation","objective":"Écouter, vérifier et proposer la prochaine étape.","documents":"<div></div><h3>Situation · Un colis incomplet</h3><p>Un client revient avec le ticket de la commande C145. Le bon indique trois articles. Il explique que le carton n’en contenait que deux. Le responsable peut vérifier le dossier de préparation. Ton rôle est de noter les faits, transmettre la demande et expliquer au client quand il aura une réponse.</p>","questions":["Écris ce que tu dis d’abord au client.","Liste trois éléments à noter pour transmettre la réclamation.","Rédige un message court au responsable en distinguant les faits vérifiés et ce que dit le client.","Écris la dernière phrase que tu dis au client avant son départ."]},"F01":{"title":"Écrire un message professionnel","objective":"Transformer des notes de quai en un message clair.","documents":"<div></div><h3>Notes de quai · Livraison BL-42</h3><p>Prévu : 10 cartons. Compté : 10. Deux cartons écrasés. Les deux cartons sont isolés en zone Q-01. Le chef d’équipe doit donner la suite.</p><h3>Repère</h3><p>Un message de travail contient un objet précis, des faits vérifiables et une demande claire.</p>","questions":["Repère le numéro du bon, le problème et l’action déjà réalisée.","Écris l’objet du message en quelques mots.","Rédige le message au chef d’équipe. Termine en demandant ce que tu dois faire des cartons isolés.","Relis ton texte. Indique une modification que tu as faite pour le rendre plus clair."]},"F02":{"title":"Faire un compte rendu oral","objective":"Préparer un oral court qui aide l’équipe à prendre une décision.","documents":"<div></div><h3>Situation · Départ au quai 4</h3><p>Le bon BP-740 indique huit cartons T-10 et quatre cartons F-20. Au quai, tu comptes huit T-10, trois F-20 et un F-21. Le camion attend. Un F-20 est disponible au bac C-03.</p><h3>Repère</h3><p>Présente le contexte, l’écart, puis l’action que tu proposes et le contrôle à faire.</p>","questions":["Écris une phrase pour situer le problème.","Explique l’écart en une phrase précise.","Propose une action et un contrôle final.","Prépare ton oral en assemblant tes phrases. Lis-le à voix haute et ajuste la formulation si nécessaire."]},"T01":{"title":"Réorganiser une tournée après un retard","objective":"Suivre le transport et traiter un aléa.","documents":"<p>À 8 h 20, un véhicule est immobilisé au dépôt. Livraisons prévues : Alpha, 4 palettes avant 10 h ; Beta, 3 palettes avant 12 h. Le véhicule de secours peut charger 5 palettes, part à 8 h 45 et met 50 min pour Alpha, déchargement 15 min. Retour au dépôt : 50 min. Dépôt → Beta : 40 min, chargement au dépôt : 10 min au second départ. Un sous-traitant peut livrer Beta à 11 h 20 pour 145 €. Pénalité Beta après 12 h : 180 €.</p>","questions":["Calcule l’heure d’arrivée chez chaque client avec le véhicule de secours seul.","Choisis une solution et justifie-la par les horaires et le coût.","Rédige un message à Beta avec l’heure d’arrivée et la prochaine mise à jour."]},"T02":{"title":"Analyser les écarts d’une semaine de transport","objective":"Analyser la qualité de service et proposer une action.","documents":"<p>Semaine 45 : Nord, 40 livraisons dont 6 en retard, 4 liées au chargement ; Sud, 60 livraisons dont 3 en retard. Objectif global : 95 % livrées à l’heure. Le responsable demande une mesure à tester la semaine suivante.</p>","questions":["Calcule le taux de ponctualité de chaque zone et le taux global.","Identifie une cause prioritaire et justifie-la à l’aide des données.","Propose une action, un responsable et un indicateur hebdomadaire."]},"O01":{"title":"Choisir un véhicule et confirmer l’enlèvement","objective":"Préparer une opération selon les contraintes du client.","documents":"<p>Demande client : 8 palettes de 420 kg, enlèvement avant 9 h 30, livraison avant 12 h. Véhicule A : 10 places, charge utile 3 200 kg. Véhicule B : 12 places, charge utile 4 500 kg. B peut se présenter à 9 h 10. Durée de chargement : 15 min. Trajet : 1 h 40.</p>","questions":["Calcule la masse totale et choisis le véhicule.","Calcule les heures de départ et d’arrivée, puis vérifie les créneaux.","Rédige la confirmation à transmettre au client."]},"O02":{"title":"Contrôler le dossier avant départ","objective":"Mettre en œuvre une opération et fiabiliser ses documents.","documents":"<p>Dossier X18 : ordre de transport, 6 palettes, quai 4, départ 14 h 15 ; bon de chargement, 5 palettes, quai 4 ; scan départ, 5 étiquettes distinctes ; consigne interne, tout écart quantité bloque le départ jusqu’à régularisation par l’exploitation.</p>","questions":["Compare les trois pièces et renseigne le relevé d’écart.","Indique qui prévenir et les vérifications à demander.","Indique quels éléments tracer pour autoriser ensuite le départ."]},"L01":{"title":"Réceptionner avec une anomalie de lot","objective":"Réaliser les opérations logistiques et fiabiliser la traçabilité.","documents":"<p>Commande R52 : 24 cartons lot L31. BL : 24 cartons lot L31. Contrôle physique : 20 cartons L31 en bon état et 4 cartons L13. Procédure locale : placer tout lot non conforme en zone d’attente, enregistrer l’écart puis prévenir le responsable.</p>","questions":["Complète un tableau commande / BL / contrôle physique.","Indique les quantités à enregistrer et l’emplacement des deux lots.","Rédige le signalement au responsable avec une demande de décision."]},"L02":{"title":"Traiter une rupture avant expédition","objective":"Coordonner l’activité logistique pour satisfaire le client.","documents":"<p>Commande C76 : 18 unités A et 12 unités B, enlèvement 15 h. Stock disponible : A 22, B 7. Entrée prévue de 10 B à 16 h, contrôle terminé au plus tôt à 16 h 20. Procédure locale : départ partiel uniquement après accord écrit du client.</p>","questions":["Calcule ce qui peut être préparé à 15 h et ce qui manque.","Compare départ partiel et report complet en indiquant leurs conditions.","Rédige le message client et indique les informations à tracer."]},"G01":{"title":"Préparer une expédition avec plusieurs lots","objective":"Préparer et expédier des marchandises.","documents":"<p>Commande : 22 cartons D. Lot D10 : 8 cartons, date limite 12/12 ; lot D11 : 12 cartons, date limite 22/12 ; lot D12 : 10 cartons, date limite 05/01. Deux cartons D10 sont bloqués. Règle locale : prélever la date limite la plus proche parmi les cartons disponibles.</p>","questions":["Propose une répartition des prélèvements par lot.","Vérifie le total et rédige la trace d’expédition.","Explique comment traiter les cartons bloqués."]},"G02":{"title":"Justifier un écart d’inventaire","objective":"Suivre le stock et la traçabilité des mouvements.","documents":"<p>Référence M17 : stock informatique 96 unités. Premier comptage : emplacement A, 54 ; B, 35. Un bon de sortie de 7 unités est signé à 10 h 10, mais non saisi. Le responsable exige un recomptage indépendant avant validation.</p>","questions":["Calcule l’écart brut et le stock théorique après saisie.","Propose les contrôles avant toute correction et justifie leur ordre.","Rédige le compte rendu d’écart."]},"C01":{"title":"Accueillir un conducteur avec un BL incomplet","objective":"Contrôler des informations et communiquer avec un partenaire.","documents":"<p>Planning : livraison A204 à 10 h, quai 2, 12 colis. À 9 h 50, le conducteur présente le BL A204 sans quantité. Contrôle visuel : 12 colis dont un emballage enfoncé. Procédure : signaler tout écart au responsable avant validation.</p>","questions":["Compare planning, BL et colis dans un tableau.","Pose deux questions au conducteur et explique la suite de ton contrôle.","Rédige un court signalement au responsable."]},"C02":{"title":"Réorganiser deux arrivées au quai","objective":"Organiser une activité simple et informer les intervenants.","documents":"<p>Quai unique. A arrive à 9 h 15, déchargement 25 min, impératif : libérer le quai avant 10 h. B arrive à 9 h, déchargement 20 min, départ au plus tard à 10 h 20. Le quai est disponible dès 9 h.</p>","questions":["Construis deux ordres de passage possibles avec les horaires.","Choisis un ordre en tenant compte de l’attente et des contraintes.","Rédige une instruction courte pour chaque conducteur."]}};

  const anchor = Object.assign(document.createElement('a'), {href:url, download:filename});
  document.body.append(anchor);
  anchor.click();

  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

  P05:{n:[['🏭','Production'],['➕','Valeur ajoutée'],['📈','Activité mesurée']]},
  R01:{n:[['😊','Accueillir'],['👂','Écouter'],['🔁','Reformuler'],['✅','Répondre']]},
  R02:{n:[['👂','Écouter'],['🙏','Reconnaître'],['🛠️','Proposer'],['📞','Suivre']]},
  F01:{n:[['✉️','Objet'],['👋','Appel'],['📝','Message'],['🤝','Politesse']]},
  F02:{n:[['🎤','Introduire'],['🗣️','Développer'],['✅','Conclure']]}
};
function schema(id) {
  const d = D[id]; if (!d) return '';
  const n = d.n.length, W = 640, H = d.c ? 320 : 150, R = 34;
  const pos = d.n.map((_, i) => d.c ? [W / 2 + 200 * Math.sin(2 * Math.PI * i / n), 130 - 95 * Math.cos(2 * Math.PI * i / n)] : [70 + (W - 140) * i / (n - 1), 60]);
  const col = i => ['#4F46E5','#EC4899','#F59E0B','#0EA5E9','#10B981'][i % 5];
  const arrows = pos.map((q, i) => {
    if (!d.c && i === n - 1) return '';
    const r = pos[(i + 1) % n], a = Math.atan2(r[1] - q[1], r[0] - q[0]);
    return `<line x1="${q[0] + (R + 6) * Math.cos(a)}" y1="${q[1] + (R + 6) * Math.sin(a)}" x2="${r[0] - (R + 10) * Math.cos(a)}" y2="${r[1] - (R + 10) * Math.sin(a)}" stroke="#94A3B8" stroke-width="3" marker-end="url(#ah)"/>`;
  }).join('');
  const nodes = pos.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="${R}" fill="${col(i)}"/><text x="${q[0]}" y="${q[1] + 11}" font-size="30" text-anchor="middle">${d.n[i][0]}</text><text x="${q[0]}" y="${q[1] + R + 20}" font-size="14" font-weight="700" text-anchor="middle" fill="#1B1F3B">${d.n[i][1]}</text>`).join('');
  return `<figure class="schema"><figcaption>📊 Schéma pour t’aider</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schéma : ${d.n.map(x => x[1]).join(', ')}"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs>${arrows}${nodes}</svg></figure>`;
}
const answered = id => (db.drafts[workKey(group, name, id, year)] || []).filter(a => a?.trim()).length;
const finished = id => answered(id) >= lessons[id].questions.length;
const avatar = n => { const w = n.trim().split(/\s+/); let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return `<span class="avatar" style="background:hsl(${h} 65% 42%)" aria-hidden="true">${esc(((w[0] || '')[0] || '') + ((w[1] || '')[0] || '')).toUpperCase()}</span>`; };
function banner(prefix) {
  const [a, b] = theme[prefix], list = ids().filter(id => id.startsWith(prefix));
  return `<section class="subj" style="--c1:${a};--c2:${b}"><div><h2>${icons[prefix]} ${subjects[prefix]}</h2><p>${list.filter(finished).length} séance(s) terminée(s) sur ${list.length}</p></div>${art[prefix]}</section>`;
}
function dashboard() {
  const list = ids(), started = list.filter(id => answered(id) > 0), fin = list.filter(finished), total = list.reduce((t, id) => t + answered(id), 0);
  const resume = started.find(id => !finished(id));
  const B = [['🌱','Premier pas',started.length >= 1],['✍️','Plume',total >= 10],['🏅','Séance terminée',fin.length >= 1],['🚀','Sur la lancée',fin.length >= 3],['🏆','Champion',list.length > 0 && fin.length === list.length]];
  return `<section class="today"><span class="today-ico" aria-hidden="true">🎯</span><div><strong>${name ? esc(name) + ' : ' : ''}${fin.length} séance(s) terminée(s) sur ${list.length}</strong><progress max="${list.length}" value="${fin.length}" aria-label="Séances terminées"></progress>${resume ? '<p>' + btn('open', '▶ Reprendre : ' + esc(lessons[resume].title), resume, true) + '</p>' : ''}</div></section>
  <div class="badges" aria-label="Mes badges">${B.map(([i, t, on]) => `<span class="bdg${on ? ' on' : ''}" title="${on ? 'Obtenu' : 'À débloquer'}"><b aria-hidden="true">${on ? i : '🔒'}</b>${t}</span>`).join('')}</div>
  <ol class="howto"><li><b>1</b>Choisis une séance</li><li><b>2</b>Réponds aux questions</li><li><b>3</b>Télécharge ton rendu</li></ol>`;
}
function home() {
  return `<div class="login"><div class="welcome"><section class="welcome-visual"><div>
    <div class="school-brand"><span class="brand-mark"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M5 8c4-2 8-2 11 1v16c-3-3-7-3-11-1z" fill="#fff"/><path d="M27 8c-4-2-8-2-11 1v16c3-3 7-3 11-1z" fill="#ffffffcc"/><path d="M25 3l1.2 2.8L29 7l-2.8 1.2L25 11l-1.2-2.8L21 7l2.8-1.2z" fill="#FDE68A"/></svg></span><span>Lycée Château d’Épluches<small>Espace élèves</small></span></div>
    <h1>Mes cours<br>et exercices</h1><p>Choisis ta classe, ton nom, puis ouvre la séance indiquée par ton professeur.</p></div>
    <div class="welcome-photo" role="img" aria-label="Des lycéens étudient un document en classe"></div>
    <div><h2 class="workflow-label">Mes matières</h2><ul class="matieres">${['S','R','F'].map(k => `<li style="--c1:${theme[k][0]};--c2:${theme[k][1]}">${art[k]}${subjects[k]}</li>`).join('')}</ul></div></section>
  <section class="card lcard"><h2>Accéder à mes séances</h2>
    <div class="help"><b>Aucun fichier à charger.</b> Tes réponses restent dans ce navigateur : télécharge ton rendu à la fin de la séance.</div>
    <form id="enter" class="lform"><label>Classe<select name="group">${groupSelect()}</select></label>
    <label>Nom et prénom<input name="student" maxlength="100" required value="${esc(name)}" autocomplete="off" placeholder="Écris ton nom et ton prénom"></label>
    <button class="primary">Voir mes séances →</button></form></section></div></div>`;
}
function shell(view) {
  return `<div class="shell"><aside class="side"><div class="school-brand"><span class="brand-mark"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M5 8c4-2 8-2 11 1v16c-3-3-7-3-11-1z" fill="#fff"/><path d="M27 8c-4-2-8-2-11 1v16c3-3 7-3 11-1z" fill="#ffffffcc"/><path d="M25 3l1.2 2.8L29 7l-2.8 1.2L25 11l-1.2-2.8L21 7l2.8-1.2z" fill="#FDE68A"/></svg></span><span>Lycée Château d’Épluches<small>Espace élèves</small></span></div>
    <nav class="nav" aria-label="Menu"><button type="button" data-a="catalog">Mes séances</button><div class="sepn"></div><button type="button" data-a="home" data-v="">Changer de classe ou de nom</button></nav>
    <div class="side-foot">Lycée professionnel</div></aside>
    <div class="main"><div class="top"><div class="top-title">${mode === 'exercise' ? 'Séance en cours' : 'Mes séances'}</div>${esc(name)} · ${esc(group)}</div><div class="page">${view}</div></div></div>`;
}
function catalog() {
  return `${btn('home','Changer d’élève ou de classe')}<h1>Mes séances · ${group}</h1><p>Ouvre la séance indiquée par le professeur.</p>
    ${dashboard()}
    ${classes[group].map(prefix => `${banner(prefix)}<div class="grid">${ids().filter(id => id.startsWith(prefix)).map(id => {
      const count = (db.drafts[workKey(group,name,id,year)] || []).filter(a => a?.trim()).length;
      return `<article class="card seance" style="--c1:${theme[prefix][0]}"><span class="num">${esc(id)}</span><h3>${esc(lessons[id].title)}</h3><p>${esc(lessons[id].objective)}</p>${scenarioMeta[id] ? '<p class="muted">' + esc(scenarioMeta[id][0]) + '</p>' : ''}
      <progress max="${lessons[id].questions.length}" value="${count}" aria-label="Réponses saisies"></progress><p class="muted"><span class="pill ${count >= lessons[id].questions.length ? 'ok' : count ? 'wip' : ''}">${count >= lessons[id].questions.length ? 'Terminée' : count ? 'En cours' : 'À commencer'}</span> ${count ? count + '/' + lessons[id].questions.length + ' réponses' : ''}</p>
      ${btn('open', count ? 'Reprendre la séance' : 'Ouvrir la séance',id,true)}</article>`;
    }).join('')}</div>`).join('')}`;
}
function exercise() {
  const item = lessons[lesson], answers = draft(), count = answers.filter(a => a?.trim()).length;
  const total = item.questions.length;
  if (step === -1) return `${btn('open','Reprendre la séance',lesson)} ${btn('print','Imprimer la fiche')}
    <section class="card"><h1>${esc(item.title)}</h1><p>${esc(item.objective)}</p>
    <p>Nom et prénom ____________________ · Classe ${esc(group)}</p>
    <div class="documents">${item.documents}</div>
    <ol>${item.questions.map(q => '<li><p>' + q + '</p></li>').join('')}</ol>
    <p>Rédige tes réponses sur une feuille en indiquant le numéro de chaque question.</p></section>`;
  if (step === total) return `${btn('catalog','Mes séances')}<section class="card"><h1>Relis et rends ton travail</h1><h2>${esc(item.title)}</h2>
    <p>${count} réponse(s) sur ${total}. Télécharge le fichier et dépose-le dans l’ENT selon la consigne de ton professeur.</p>
    ${count < total ? '<p class="warning">Des réponses sont encore vides.</p>' : '<p class="bravo">🎉 Bravo, tu as répondu à toutes les questions !</p>'}
    ${item.questions.map((q,i) => `<article><h3>${q}</h3><p class="answer">${esc(answers[i] || 'Réponse vide')}</p>${btn('question','Revoir cette réponse',i)}</article>`).join('')}
    <div class="row">${btn('submit','Télécharger mon travail (.txt)', '', true)}${btn('print','Imprimer / Enregistrer en PDF')}</div></section>`;
  return `${btn('catalog','Mes séances')}<section class="lesson-hero" style="--c1:${theme[lesson[0]][0]};--c2:${theme[lesson[0]][1]}"><div><span class="tag">${icons[lesson[0]]} ${esc(subjects[lesson[0]])} · ${esc(lesson)}</span><h1>${esc(item.title)}</h1><p>${esc(item.objective)}</p></div>${art[lesson[0]]}</section>
    <p class="muted">Question ${step + 1} sur ${total} · ${count} réponse(s) saisie(s)</p><progress max="${total}" value="${count}" aria-label="Réponses saisies"></progress>
     <div class="steps" role="group" aria-label="Questions">${item.questions.map((q,i) => `<button type="button" data-a="question" data-v="${i}" class="stp${answers[i]?.trim() ? ' done' : ''}${i === step ? ' on' : ''}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div>
    <div class="guide"><details open class="scroll"><summary>Lire les documents et les repères</summary><div class="documents">${item.documents}${schema(lesson)}</div>${btn('paper','Ouvrir la fiche papier')}</details>
      <section class="card lead"><h2>${step ? 'Réponds à cette question' : 'Commence ici'}</h2>
      <p>Lis les documents à côté. Écris ta réponse ci-dessous, puis clique sur « ${step + 1 === total ? 'Enregistrer et relire' : 'Enregistrer et continuer'} ».</p>
      <label class="question" for="answer">${item.questions[step]}</label><textarea id="answer" rows="7" maxlength="10000">${esc(answers[step])}</textarea>
      <div class="row">${step ? btn('question','Précédente',step - 1) : ''}
      ${btn('save-page','Enregistrer et quitter')}${btn('next',step + 1 === total ? 'Enregistrer et relire' : 'Enregistrer et continuer','',true)}</div>
      </section></div>`;
}
function render() {
  const view = ({home,catalog,exercise})[mode]();
  app.innerHTML = mode === 'home' ? view : shell(view);

}
function go(screen) { mode = screen; report(''); render(); window.scrollTo(0,0); }
app.addEventListener('copy', event => {
  if (mode === 'exercise' && event.target.id !== 'answer' && !event.target.closest('input, textarea')) event.preventDefault();
});
for (const type of ['paste', 'drop']) {
  app.addEventListener(type, event => {
    if (event.target.id !== 'answer') return;
    event.preventDefault();
    report('Saisis ta r\u00e9ponse directement dans le champ.');
  });
}
app.addEventListener('input', event => {
  if (event.target.id !== 'answer') return;
  const values = draft().slice();
  values[step] = event.target.value;
  db.drafts[currentKey()] = values;
  save();
});
app.addEventListener('click', async event => {
  const button = event.target.closest('[data-a]');
  if (!button) return;
  const {a,v} = button.dataset;
  if (['home','catalog'].includes(a)) return go(a);
  if (a === 'open') {
    if (!ids().includes(v)) return;
    lesson = v;
    const savedStep = db.resume[currentKey()];
    step = Number.isInteger(savedStep) && savedStep >= 0 && savedStep <= lessons[lesson].questions.length
      ? savedStep : lessons[lesson].questions.findIndex((_,i) => !draft()[i]?.trim());
    if (step < 0) step = lessons[lesson].questions.length;
    return go('exercise');
  }
  if (a === 'save-page' || a === 'next') {
    const key = currentKey();
    db.resume[key] = a === 'next' ? step + 1 : step;
    if (!save()) return;
    if (a === 'save-page') {
      go('catalog');
      return report('Brouillon enregistré sur cet appareil.');
    }
    step = db.resume[key];
    return go('exercise');
  }
  if (a === 'question') { step = Number(v); return go('exercise'); }
  if (a === 'submit') {
    if (!draft().some(value => value?.trim())) return report('Écris au moins une réponse avant de télécharger.');
    const item = lessons[lesson];
    const plain = markup => new DOMParser().parseFromString(markup, 'text/html').body.textContent;
    const lines = [item.title, name + ' · ' + group, 'Séance ' + lesson, '',
      ...item.questions.flatMap((question, i) => [plain(question), draft()[i] || '', ''])];
    const studentName = name.replace(/[^\p{L}\p{N}_-]+/gu, '_');
    download('Rendu-' + lesson + '-' + studentName + '.txt', '\ufeff' + lines.join('\r\n'), 'text/plain;charset=utf-8');
    return report('Rendu téléchargé. Tu peux maintenant le déposer dans l’ENT.');
  }
  if (a === 'paper') { step = -1; return go('exercise'); }
  if (a === 'print') return window.print();
});
app.addEventListener('submit', event => {
  event.preventDefault();
  const form = event.target, data = new FormData(form);
  if (form.id === 'enter') {
    name = data.get('student').trim();
    group = data.get('group');
    year = today.getFullYear() - (today.getMonth()<8 ? 1 : 0);
    if (name && Object.hasOwn(classes,group)) go('catalog');
  }
});
app.addEventListener('change', event => {
  const el = event.target, form = el.form;
  if (!form || form.id !== 'enter') return;
  if (el.name === 'group') {
    group = el.value; name = ''; form.querySelector('[name=student]').value = '';
  }
});
render();
</script></body></html>
