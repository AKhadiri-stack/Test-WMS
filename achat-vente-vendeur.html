<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ventes · Proliance · TP Achat-Vente</title><style>:root{--navy:#1d3557;--navy2:#274b7a;--orange:#ee8a2a;--bg:#f3f5f9;--line:#e2e7ef;--txt:#1f2a37}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt)}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}aside{padding:26px 18px;background:var(--navy);color:white}aside strong{font-size:19px}aside p{color:#e0e8f5;margin:5px 0 32px}ol{padding-left:25px}li{padding:7px 5px;margin-bottom:5px}li[aria-current]{background:var(--orange);color:#14253b;border-radius:6px;font-weight:750}main{width:100%;max-width:1120px;padding:24px 36px 60px}h1,h2,h3{line-height:1.2}h1{margin:0 0 20px}h2{margin:0 0 12px}.hero{background:linear-gradient(100deg,var(--navy),var(--navy2));color:white;border-radius:14px;padding:25px;margin-bottom:20px;border-left:6px solid var(--orange)}.hero p{margin:0}.panel,article{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:15px;overflow-wrap:anywhere}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar>*{margin:0}label{display:block;font-weight:650;margin:12px 0}input,textarea,select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #8795a9;border-radius:6px;font:inherit}textarea{min-height:88px;resize:vertical}button{background:var(--navy);color:white;border:0;border-radius:7px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e7edf5;color:var(--navy)}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #bd6011;outline-offset:2px}#notice{min-height:1.5em;color:#8a3820}dt{font-weight:700}dd{margin:0 0 10px;white-space:pre-wrap}summary{cursor:pointer;font-weight:700}small{font-size:14px}code{overflow-wrap:anywhere} [hidden]{display:none!important}@media(max-width:710px){.shell{display:block}aside{padding:15px}aside p{margin:3px 0}aside ol{display:none}main{padding:20px 14px}}@media print{aside,button,form,#notice,#task,#wait,.bar.controls{display:none!important}.shell{display:block}main{max-width:none;padding:0}.hero{color:#172945;background:white}.panel,article{break-inside:avoid}}</style></head>
<body><div class="shell"><aside><strong>GATL · Château d’Épluches</strong><p>TP Achat-Vente</p><nav aria-label="Étapes du dossier"><ol id="timeline"><li>Demande de devis</li><li>Devis</li><li>Bon de commande</li><li>Bon de livraison</li><li>Réclamation</li><li>Réponse à la réclamation</li></ol></nav></aside>
<main><header class="hero"><h1>Ventes · Proliance</h1><p>Traite la demande du client et organise les expéditions.</p></header>
<form class="panel" id="connect"><label for="code">Code individuel</label><input id="code" type="password" autocomplete="off" spellcheck="false" maxlength="36" required><button>Ouvrir le dossier</button></form>
<div class="bar controls" id="controls" hidden><button type="button" id="refresh">Actualiser</button><button type="button" id="print" class="secondary">Imprimer / PDF</button><button type="button" id="leave" class="secondary">Quitter</button></div>
<p id="notice" role="status"></p><div id="workspace" hidden><p id="context"></p><p id="wait" class="panel" role="status" hidden></p><section id="task" class="panel" hidden><h2 id="task-title"></h2><p id="task-brief"></p><form id="document"></form></section><h2 id="history-title" hidden>Documents échangés</h2><div id="history"></div></div></main></div>
<script>
const ROLE="vendeur";
const ENDPOINT='https://vcrodgslfonzcwfoaqsg.supabase.co/rest/v1/rpc/gatl_tp_exchange';
const KEY="sb_publishable_ikYImUebaJgUTjz_dMKZmA_7rzbBfYj";
const MISSIONS=[["Demande de devis","",["Référence","Quantité souhaitée","Délai souhaité","Message professionnel"]],["Devis","Proliance dispose de 90 cartons vendredi. Le réapprovisionnement permet un second envoi mardi. Le carton coûte 18,50 € HT, le transport 65 € HT pour les deux envois. Calcule le total et explique les conditions au client.",["Cartons disponibles vendredi","Solde à livrer","Prix unitaire HT (€)","Transport HT (€)","Total HT (€)","Conditions et délais"]],["Bon de commande","",["Référence du devis","Quantité commandée","Total HT accepté (€)","Consignes de livraison"]],["Bon de livraison","Le quai prépare uniquement le lot de vendredi. Vérifie la commande reçue puis indique la quantité censée partir et le solde à expédier mardi. Précise au destinataire ce qu’il doit contrôler.",["Référence de la commande","Quantité annoncée sur le bon","Solde restant","Consignes au quai"]],["Réclamation","",["Référence du bon de livraison","Cartons reçus","Cartons manquants","Réserves et demande"]],["Réponse à la réclamation","Le quai fournisseur confirme l’oubli de deux cartons. Tu peux proposer une livraison des deux cartons en urgence sans frais, ou les joindre au solde mardi avec l’accord du client. Choisis une option et explique le suivi.",["Référence de la réclamation","Solution et délai","Message au client"]]];


const $ = id => document.getElementById(id);
const node = (tag, value) => {
  const el = document.createElement(tag);
  if (value !== undefined) el.textContent = value;
  return el;
};
let code = '';
let busy = false;
let lastStage = -1;
let active = false;
function notice(message){ $('notice').textContent = message; }
async function exchange(action, stage = null, data = null) {
  const response = await fetch(ENDPOINT, {method:'POST',
    headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_code:code,p_role:ROLE,p_action:action,p_stage:stage,p_data:data})});
  const result = await response.json();
  if (!response.ok) throw new Error(result.message || 'Échange indisponible.');
  return result;
}
async function run(action, stage, data) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('button').forEach(button => button.disabled = true);
  try {
    const state = await exchange(action,stage,data);
    render(state);
    notice(action === 'send' ? 'Document enregistré. Il est disponible dans le dossier de l’autre équipe.' : '');
  } catch(error){ notice(error.message); }
  finally {
    busy = false;
    document.querySelectorAll('button').forEach(button => button.disabled = false);
  }
}
function documentCard(item) {
  const article = node('article');
  const prefix = ['DD','DV','BC','BL','RC','RP'][item.stage];
  article.append(node('h3',MISSIONS[item.stage][0] + ' · ' + prefix + '-0412'),
    node('p',item.alias+' · '+new Date(item.sent_at).toLocaleString('fr-FR')));
  const list = node('dl');
  for (const key of MISSIONS[item.stage][2]) list.append(node('dt',key),node('dd',item.payload[key] || ''));
  article.append(list);
  return article;
}
$('connect').addEventListener('submit',event=>{
  event.preventDefault();
  code=$('code').value.trim().toLowerCase();
  if (!/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/.test(code)) {
    notice('Saisis le code complet communiqué par ton professeur.');
    return;
  }
  run('read');
});
$('refresh').onclick=()=>run('read');
$('print').onclick=()=>window.print();
$('leave').onclick=()=>location.reload();
function show(){
  $('connect').hidden=true;
  $('controls').hidden=false;
  $('workspace').hidden=false;
}


function render(state){
  show();
  active=true;
  if(state.stage === lastStage) return;
  lastStage=state.stage;
  $('context').textContent=state.label+' · '+state.alias;
  [...$('timeline').children].forEach((li,i)=>{
    li.textContent=MISSIONS[i][0]+(i<state.stage?' ✓':'');
    if(i===state.stage) li.setAttribute('aria-current','step'); else li.removeAttribute('aria-current');
  });
  $('history').replaceChildren(...state.docs.map(documentCard).reverse());
  $('history-title').hidden=!state.docs.length;
  const ownTurn=state.stage<6 && (state.stage%2===0?'acheteur':'vendeur')===ROLE;
  $('task').hidden=!ownTurn;
  $('wait').hidden=ownTurn;
  $('wait').textContent=state.stage===6?'Dossier terminé. Consulte les six documents ou imprime le dossier.':
    'L’autre équipe prépare le prochain document. Le dossier se met à jour automatiquement.';
  if(!ownTurn) return;
  const [title,brief,fields]=MISSIONS[state.stage];
  $('task-title').textContent=title;
  $('task-brief').textContent=brief;
  const form=$('document');
  form.replaceChildren();
  for(const field of fields){
    const label=node('label',field);
    const input=node(/Message|Conditions|Consignes|Réserves/.test(field)?'textarea':'input');
    input.name=field;
    input.required=true;
    input.maxLength=1200;
    label.append(input);
    form.append(label);
  }
  form.append(node('button','Valider et transmettre'));
  form.onsubmit=event=>{
    event.preventDefault();
    run('send',state.stage,Object.fromEntries(new FormData(form)));
  };
}
setInterval(()=>{if(active&&!document.hidden&&!busy) run('read');},5000);

</script></body></html>
